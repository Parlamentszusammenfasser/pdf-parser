[project]
name = "pazufa-pdf-parser"
version = "0.1.0"
description = "Robust extraction of structured information and sanitized text from PDF documents (letters, legal and parliamentary documents)"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "Benedikt Schäfer", email = "benedikt-schaefer@posteo.de" }
]
requires-python = ">=3.12"
dependencies = [
    "pillow>=13.0.0",
    "pypdfium2>=5.14.0",
]

[project.scripts]
pazufa-pdf-parser = "pazufa_pdf_parser:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "lxml>=6.1.3",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ocr: needs a working tesseract installation with German data",
    "samples: runs against real sample PDFs (set PAZUFA_SAMPLES_DIR)",
]

[tool.coverage.run]
source = ["pazufa_pdf_parser"]

[tool.coverage.report]
fail_under = 90

# Releases (CI on main): the next version comes from Conventional Commits.
# PSR bumps project.version, re-locks, builds, commits "chore(release): x.y.z",
# tags x.y.z and creates a GitHub Release with the wheel and sdist attached.
# The bump is committed so `git+…@x.y.z` installs report the right version.
[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
tag_format = "{version}"
allow_zero_version = true
major_on_zero = false  # breaking changes bump the minor version while in 0.x
commit_message = "chore(release): {version}"
build_command = "uv lock --upgrade-package pazufa-pdf-parser && git add uv.lock && uv build"

[tool.semantic_release.remote]
type = "github"
token = { env = "GH_TOKEN" }

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.publish]
dist_glob_patterns = ["dist/*"]
upload_to_vcs_release = true

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]
# README examples align their comments for readability
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "S"]

[tool.ruff.lint.per-file-ignores]
# asserts, subprocess calls to qpdf and fake passwords are what tests are made of
"tests/**" = ["S101", "S106", "S311", "S603", "S607"]
# tesseract runs from an argv list, never through a shell
"src/pazufa_pdf_parser/extract/ocr.py" = ["S603"]
# Removed by #14 (classification and field extraction); not worth fixing first.
"src/pazufa_pdf_parser/classify.py" = ["E501", "S101"]
"src/pazufa_pdf_parser/fields/**" = ["E501"]
"tests/test_classify.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true

# Removed by #14 (classification and field extraction); not worth fixing first.
[[tool.mypy.overrides]]
module = ["pazufa_pdf_parser.classify", "pazufa_pdf_parser.fields.*", "pazufa_pdf_parser.render.legalxml"]
ignore_errors = true
