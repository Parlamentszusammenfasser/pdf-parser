name: CI

# Stage 1, in parallel: dependency audit, secret scan, CodeQL, workflow lint,
#   and on PRs a Conventional-Commit title check (the squash commit becomes the
#   release note).
# Stage 2, after the audit: ruff, mypy, pytest on 3.12–3.14 with coverage, and
#   a wheel build that is installed and smoke-tested.
# Stage 3, main only: semantic release. Version bump commit, x.y.z tag, GitHub
#   Release with wheel + sdist and a build-provenance attestation.
#
# Consumers install a release with
#   uv add "pazufa-pdf-parser @ git+https://github.com/Parlamentszusammenfasser/pdf-parser@x.y.z"
# and can verify a downloaded wheel with
#   gh attestation verify pazufa_pdf_parser-x.y.z-py3-none-any.whl -R Parlamentszusammenfasser/pdf-parser
#
# Every action is pinned to a commit SHA; tools are pinned to versions at least
# two weeks old at the time of pinning. Dependabot (.github/dependabot.yml)
# keeps actions and uv.lock current; UV_VERSION, zizmor, trufflehog's image and
# python-semantic-release are bumped by hand.

# PRs run once as pull_request; a push trigger on every branch ran the same jobs twice
on:
  push:
    branches: [main]
  pull_request:

# On main a running pipeline is never cancelled: it may be cutting a release.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  UV_VERSION: '0.13.6'

jobs:
  # Scan uv.lock for packages with known advisories before anything is
  # installed. Results also go to the GitHub Security tab.
  dependency-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: uv.lock
          scanners: vuln
          exit-code: '1'
          format: sarif
          output: trivy-results.sarif

      - name: Upload results to Security tab
        if: always()
        continue-on-error: true  # non-fatal on repos without code scanning enabled
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-results.sarif

  # Every commit of the push or PR, not just the final tree: a key that was
  # committed and deleted again is still in the history.
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2 # v3.99.7
        with:
          # the action pulls the image itself and defaults to :latest
          version: 3.99.7@sha256:0d003fc3abc4e1565eca8462b992001314de51451e96e3c44de80d116794d5d1
          extra_args: --results=verified,unknown

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: python, actions
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3

  # Audits the workflows themselves: injection, unpinned actions, credentials.
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pipx install "uv==$UV_VERSION"
      - run: uvx zizmor==1.31.1 --format=github .github/workflows

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check Conventional Commit title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! grep -Eq '^(feat|fix|perf|refactor|docs|test|build|ci|chore)(\([a-z0-9_-]+\))?!?: .+' <<<"$TITLE"; then
            echo "::error::PR title must be a Conventional Commit, e.g. 'fix(footers): keep last paragraph'. It becomes the squash commit that drives the release version."
            exit 1
          fi

  # ruff and mypy come from uv.lock, so CI checks with the same versions as local runs.
  lint:
    needs: dependency-audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - ruff check
          - ruff format --check
          - mypy
    name: ${{ matrix.check }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pipx install "uv==$UV_VERSION"
      - run: uv sync --locked
      - name: Run ${{ matrix.check }}
        run: uv run ${{ matrix.check }}

  pytest:
    needs: dependency-audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # a failure on one version shouldn't hide the others
      matrix:
        python: ['3.12', '3.13', '3.14']
    name: pytest (${{ matrix.python }})
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # tesseract + deu so the ocr tests run instead of skipping; qpdf for the
      # encrypted-PDF test; DejaVu is the font the fake scans are drawn with.
      - name: Install system packages
        run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr tesseract-ocr-deu qpdf fonts-dejavu-core

      - run: pipx install "uv==$UV_VERSION"
      - run: uv sync --locked

      # -rs lists skip reasons; with tesseract installed nothing should skip.
      # Fails below 90 % line coverage (fail_under in pyproject.toml).
      - name: Run tests with coverage
        run: uv run pytest -rs --cov --cov-report=term-missing

  # Proves the package builds and the wheel works outside the source tree.
  build:
    needs: dependency-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pipx install "uv==$UV_VERSION"
      - run: uv build
      - name: Smoke-test the wheel
        run: |
          wheel=$(ls dist/*.whl)
          uv run --isolated --no-project --with "$wheel" pazufa-pdf-parser --version
          uv run --isolated --no-project --with "$wheel" python -c "import pazufa_pdf_parser as p; print(p.__version__, p.__all__)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 7

  # No-op unless a feat/fix/perf (or breaking) commit landed since the last tag.
  # Configuration: [tool.semantic_release] in pyproject.toml.
  release:
    needs: [dependency-audit, secrets-scan, codeql, workflow-lint, lint, pytest, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write      # push the release commit and tag, create the GitHub Release
      id-token: write      # sign the provenance attestation
      attestations: write  # store it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # PSR reads all commits and tags since the last release
          persist-credentials: false  # PSR pushes with GH_TOKEN itself
      - run: pipx install "uv==$UV_VERSION"
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Bumps the version, re-locks and builds (build_command), commits, tags,
      # pushes and creates the GitHub Release. Writes released/version/tag to
      # GITHUB_OUTPUT.
      - name: Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uvx --from python-semantic-release==10.5.3 semantic-release version --no-changelog

      - name: Attest build provenance
        if: steps.release.outputs.released == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Attach wheel and sdist to the GitHub Release
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uvx --from python-semantic-release==10.5.3 semantic-release publish
